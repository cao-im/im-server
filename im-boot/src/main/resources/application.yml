# ============================================================
# 曹操IM Server - JAR包内默认配置（开发环境使用）
# ============================================================
#
# ⚠️ 重要提示：
#    此配置文件打包到JAR包内部，仅作为默认值！
#
# 📌 生产环境部署时：
#    请在JAR包同目录下的 config/application.yml 中修改配置
#    优先级：config/application.yml > 此文件
#
# 🔧 开发调试时：
#    可直接修改此文件，或使用 --spring.config.location 指定外部配置
#
# ============================================================

server:
  # 默认端口（可在 config/application.yml 中覆盖）
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cao_im_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: rootlocal

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: im-server-jwt-secret-key-2024-must-be-long-enough-for-hs256-algorithm
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html  # SpringDoc 2.x 标准路径（开发环境）
    enabled: true

# API 日志配置
api-log:
  enabled: true
  log-headers: true
  log-params: true
  log-body: true
  log-response: true
  max-body-length: 2000
  exclude-paths:
    - /swagger-ui
    - /v3/api-docs
    - /api-docs
    - /static
    - /favicon
    - /ws

# 日志级别配置 (开发环境Debug模式)
logging:
  level:
    com.caoim.imcore.config.ApiLogFilter: DEBUG
    org.springframework.web.filter: DEBUG
    com.caoim.imserver: DEBUG
